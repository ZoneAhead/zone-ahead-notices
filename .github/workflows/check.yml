# Checks every proposed notice, so a mistake can't be merged.
name: Check notices
on:
  pull_request:
    paths: [notices.json, scripts/**]
  push:
    branches: [main]
    paths: [notices.json, scripts/**]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs notices.json
